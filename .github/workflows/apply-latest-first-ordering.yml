name: Apply latest-first planning ordering

on:
  push:
    branches:
      - feature/edit-planning-submission-dates

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/edit-planning-submission-dates

      - name: Apply ordering changes
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path("app/admin/supervisions/[caseId]/page.tsx"),
              Path("app/student/page.tsx"),
          ]

          old_order = '.order("target_date", { ascending: true }),' 
          new_order = '.order("target_date", { ascending: false }),' 

          for path in targets:
              text = path.read_text(encoding="utf-8")
              if old_order not in text:
                  raise SystemExit(f"Expected milestone ordering not found in {path}")
              path.write_text(text.replace(old_order, new_order, 1), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          old_line = "- Added full editing for supervision milestones, including title, description, target date, and status."
          new_line = "- Added full editing for supervision milestones, including title, description, target date, and status, with the latest target dates shown first."
          if old_line not in text:
              raise SystemExit("Expected beta.2 milestone changelog line not found")
          changelog.write_text(text.replace(old_line, new_line, 1), encoding="utf-8")

          workflow = Path(".github/workflows/apply-latest-first-ordering.yml")
          workflow.unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/supervisions/'[caseId]'/page.tsx app/student/page.tsx CHANGELOG.md .github/workflows/apply-latest-first-ordering.yml
          git commit -m "Order planning records newest first"
          git push origin HEAD:feature/edit-planning-submission-dates
