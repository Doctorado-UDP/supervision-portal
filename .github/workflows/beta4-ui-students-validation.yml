name: Validate beta.4 navigation and student workflow

on:
  push:
    branches:
      - feature/beta4-access-account-releases

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beta4-access-account-releases
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Add invite-section anchor
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/admin/access/page.tsx")
          text = path.read_text()
          old = '<div className="rounded-xl border border-gray-200 bg-white p-6 shadow-sm lg:col-span-2">\n          <h2 className="text-lg font-semibold text-gray-950">Invite user</h2>'
          new = '<div\n          id="invite-user"\n          className="rounded-xl border border-gray-200 bg-white p-6 shadow-sm lg:col-span-2"\n        >\n          <h2 className="text-lg font-semibold text-gray-950">Invite user</h2>'

          if old not in text:
              raise SystemExit("Invite-user card pattern not found")

          path.write_text(text.replace(old, new, 1))

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
          git diff --check

      - name: Commit anchor and remove temporary workflow
        run: |
          git config user.name "Bastián González-Bustamante"
          git config user.email "b.a.gonzalez.bustamante@fgga.leidenuniv.nl"
          git add app/admin/access/page.tsx
          git rm .github/workflows/beta4-ui-students-validation.yml
          git commit -m "Polish beta.4 navigation and student workflow"
          git push origin HEAD:feature/beta4-access-account-releases
