name: Finalize beta.4

on:
  push:
    branches:
      - feature/beta4-access-account-releases
    paths-ignore:
      - supabase/config.toml
      - CHANGELOG.md
      - package-lock.json

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beta4-access-account-releases

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Finalize repository metadata and production config
        run: |
          python scripts/finalize_beta4.py
          npm install --package-lock-only --ignore-scripts

      - name: Validate beta.4
        run: |
          npm ci
          npm run lint
          npm run build
          git diff --check

      - name: Commit generated and finalised files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/config.toml CHANGELOG.md package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Finalize Ivory Monolith metadata and config"
            git push
          fi
