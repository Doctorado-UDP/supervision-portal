name: Apply beta.3 submission deletion

on:
  push:
    branches:
      - feature/editable-rich-feedback

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editable-rich-feedback

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply beta.3 changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_regex(path, pattern, replacement, label):
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              p.write_text(new_text)

          # Keep posted and edited metadata on one line in the admin view.
          replace_regex(
              'components/admin/admin-submissions-section.tsx',
              r'<p className="mt-1 text-xs text-gray-500">\s*Posted \{formatPortalDateTime\(item\.created_at\)\}\s*</p>\s*\{wasEdited && \(\s*<p className="mt-1 text-xs text-gray-500">\s*Edited \{formatPortalDateTime\(item\.updated_at\)\}\s*</p>\s*\)\}',
              '''<p className="mt-1 text-xs text-gray-500">
                                    Posted {formatPortalDateTime(item.created_at)}
                                    {wasEdited
                                      ? ` · Edited ${formatPortalDateTime(item.updated_at)}`
                                      : ""}
                                  </p>''',
              'admin feedback timestamp'
          )

          # Keep posted and edited metadata on one line in the student view.
          replace_regex(
              'app/student/page.tsx',
              r'<p className="mt-1 text-xs text-gray-500">\s*Posted \{formatPortalDateTime\(item\.created_at\)\}\s*</p>\s*\{new Date\(item\.updated_at\)\.getTime\(\) >\s*new Date\(item\.created_at\)\.getTime\(\) \+ 1000 && \(\s*<p className="mt-1 text-xs text-gray-500">\s*Edited \{formatPortalDateTime\(item\.updated_at\)\}\s*</p>\s*\)\}',
              '''<p className="mt-1 text-xs text-gray-500">
                                      Posted {formatPortalDateTime(item.created_at)}
                                      {new Date(item.updated_at).getTime() >
                                      new Date(item.created_at).getTime() + 1000
                                        ? ` · Edited ${formatPortalDateTime(item.updated_at)}`
                                        : ""}
                                    </p>''',
              'student feedback timestamp'
          )

          # Server-side submission deletion, restricted to the global supervisor.
          Path('app/admin/supervisions/[caseId]/submission-delete-actions.ts').write_text('''"use server";

          import { revalidatePath } from "next/cache";

          import { requireGlobalSupervisor } from "@/lib/auth/require-admin";
          import { createClient } from "@/lib/supabase/server";

          function revalidateSupervisionPages(caseId: string) {
            revalidatePath("/admin");
            revalidatePath("/admin/supervisions");
            revalidatePath(`/admin/supervisions/${caseId}`);
            revalidatePath("/student");
          }

          export async function deleteSubmission(formData: FormData) {
            await requireGlobalSupervisor();
            const supabase = await createClient();
            const caseId = String(formData.get("case_id") ?? "").trim();
            const submissionId = String(formData.get("submission_id") ?? "").trim();

            if (!caseId || !submissionId) return;

            const { data: submission, error: submissionError } = await supabase
              .from("submissions")
              .select("id, file_path")
              .eq("id", submissionId)
              .eq("case_id", caseId)
              .maybeSingle();

            if (submissionError || !submission) {
              console.error(submissionError);
              return;
            }

            const { error: deleteError } = await supabase
              .from("submissions")
              .delete()
              .eq("id", submissionId)
              .eq("case_id", caseId);

            if (deleteError) {
              console.error(deleteError);
              return;
            }

            const { error: storageError } = await supabase.storage
              .from("submissions")
              .remove([submission.file_path]);

            if (storageError) {
              console.error("Submission metadata was deleted, but file cleanup failed.", storageError);
            }

            revalidateSupervisionPages(caseId);
          }
          ''')

          # Global-supervisor-only delete control with an explicit destructive warning.
          Path('components/admin/submission-delete-form.tsx').write_text('''"use client";

          import { deleteSubmission } from "@/app/admin/supervisions/[caseId]/submission-delete-actions";

          type SubmissionDeleteFormProps = {
            caseId: string;
            submissionId: string;
          };

          export default function SubmissionDeleteForm({
            caseId,
            submissionId,
          }: SubmissionDeleteFormProps) {
            return (
              <form
                action={deleteSubmission}
                className="mt-3"
                onSubmit={(event) => {
                  if (
                    !window.confirm(
                      "Delete this submission, its uploaded file, and all associated feedback? This cannot be undone."
                    )
                  ) {
                    event.preventDefault();
                  }
                }}
              >
                <input type="hidden" name="case_id" value={caseId} />
                <input type="hidden" name="submission_id" value={submissionId} />
                <button
                  type="submit"
                  className="rounded-md border border-red-200 bg-white px-3 py-2 text-xs font-medium text-red-700 hover:bg-red-50"
                >
                  Delete submission
                </button>
              </form>
            );
          }
          ''')

          # Import and show the delete control only for the global supervisor.
          path = Path('components/admin/admin-submissions-section.tsx')
          text = path.read_text()
          if 'import SubmissionDeleteForm from "@/components/admin/submission-delete-form";' not in text:
              marker = 'import SubmissionEditForm from "@/components/admin/submission-edit-form";\n'
              if marker not in text:
                  raise SystemExit('submission delete import marker not found')
              text = text.replace(
                  marker,
                  marker + 'import SubmissionDeleteForm from "@/components/admin/submission-delete-form";\n',
                  1,
              )
          path.write_text(text)

          replace_regex(
              'components/admin/admin-submissions-section.tsx',
              r'(\{canEditSubmissionDates && \(\s*<SubmissionEditForm\s*caseId=\{caseId\}\s*submission=\{\{\s*id: submission\.id,\s*submitted_at: submission\.submitted_at,\s*original_date: submission\.original_date,\s*\}\}\s*/>\s*\)\})',
              r'''\1
                        {canEditSubmissionDates && (
                          <SubmissionDeleteForm
                            caseId={caseId}
                            submissionId={submission.id}
                          />
                        )}''',
              'submission delete control'
          )

          # Mirror the migration already applied to the linked Supabase project.
          Path('supabase/migrations/20260825090109_restrict_submission_deletion.sql').write_text('''drop policy if exists "Assigned staff can delete own case submissions"
          on public.submissions;

          drop policy if exists "Users can delete permitted submissions"
          on public.submissions;

          create policy "Global supervisor can delete submissions"
          on public.submissions
          for delete
          to authenticated
          using (private.is_global_supervisor());

          drop policy if exists "Case users delete own case submission files"
          on storage.objects;

          drop policy if exists "Users can delete permitted submission files"
          on storage.objects;

          create policy "Global supervisor can delete submission files"
          on storage.objects
          for delete
          to authenticated
          using (
            bucket_id = 'submissions'
            and private.is_global_supervisor()
          );

          create policy "Uploaders can delete orphan submission files"
          on storage.objects
          for delete
          to authenticated
          using (
            bucket_id = 'submissions'
            and owner_id = (auth.uid())::text
            and not exists (
              select 1
              from public.submissions s
              where s.file_path = storage.objects.name
            )
          );
          ''')

          # Release notes.
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '- Added global-supervisor-only feedback deletion with confirmation.\n'
          addition = '- Added global-supervisor-only submission deletion, including its private Storage file and associated feedback.\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('changelog summary marker not found')
              text = text.replace(marker, marker + addition, 1)

          marker = '- Migration `20260825084421_restrict_feedback_deletion.sql` removes assigned-staff feedback deletion at the database-policy level.\n'
          addition = '- Migration `20260825090109_restrict_submission_deletion.sql` restricts persisted submission and file deletion to the primary/global supervisor while preserving uploader cleanup of failed-upload orphan files.\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('changelog migration marker not found')
              text = text.replace(marker, marker + addition, 1)
          path.write_text(text)

          # Guard against silent partial application.
          admin = Path('components/admin/admin-submissions-section.tsx').read_text()
          student = Path('app/student/page.tsx').read_text()
          assert 'Delete submission' in Path('components/admin/submission-delete-form.tsx').read_text()
          assert '<SubmissionDeleteForm' in admin
          assert ' · Edited ${formatPortalDateTime(item.updated_at)}' in admin
          assert ' · Edited ${formatPortalDateTime(item.updated_at)}' in student
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
          git diff --check

      - name: Commit beta.3 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components supabase/migrations CHANGELOG.md
          git commit -m "Add global-supervisor submission deletion"
          git push
