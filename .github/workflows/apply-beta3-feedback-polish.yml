name: Apply beta.3 feedback polish

on:
  push:
    branches:
      - feature/editable-rich-feedback

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editable-rich-feedback

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply feedback polish
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # Global-supervisor-only delete server action.
          Path('app/admin/supervisions/[caseId]/feedback-delete-actions.ts').write_text('''"use server";

          import { revalidatePath } from "next/cache";

          import { requireGlobalSupervisor } from "@/lib/auth/require-admin";
          import { createClient } from "@/lib/supabase/server";

          function revalidateSupervisionPages(caseId: string) {
            revalidatePath("/admin");
            revalidatePath(`/admin/supervisions/${caseId}`);
            revalidatePath("/student");
          }

          export async function deleteFeedback(formData: FormData) {
            await requireGlobalSupervisor();
            const supabase = await createClient();
            const caseId = String(formData.get("case_id") ?? "").trim();
            const feedbackId = String(formData.get("feedback_id") ?? "").trim();

            if (!caseId || !feedbackId) return;

            const { data: feedbackItem, error: feedbackError } = await supabase
              .from("feedback")
              .select("id, submission_id")
              .eq("id", feedbackId)
              .maybeSingle();

            if (feedbackError || !feedbackItem) {
              console.error(feedbackError);
              return;
            }

            const { data: submission, error: submissionError } = await supabase
              .from("submissions")
              .select("id")
              .eq("id", feedbackItem.submission_id)
              .eq("case_id", caseId)
              .maybeSingle();

            if (submissionError || !submission) {
              console.error(submissionError);
              return;
            }

            const { error } = await supabase
              .from("feedback")
              .delete()
              .eq("id", feedbackId);

            if (error) {
              console.error(error);
              return;
            }

            revalidateSupervisionPages(caseId);
          }
          ''')

          # Delete control with confirmation.
          Path('components/admin/feedback-delete-form.tsx').write_text('''"use client";

          import { deleteFeedback } from "@/app/admin/supervisions/[caseId]/feedback-delete-actions";

          type FeedbackDeleteFormProps = {
            caseId: string;
            feedbackId: string;
          };

          export default function FeedbackDeleteForm({
            caseId,
            feedbackId,
          }: FeedbackDeleteFormProps) {
            return (
              <form
                action={deleteFeedback}
                className="mt-3"
                onSubmit={(event) => {
                  if (!window.confirm("Delete this feedback? This cannot be undone.")) {
                    event.preventDefault();
                  }
                }}
              >
                <input type="hidden" name="case_id" value={caseId} />
                <input type="hidden" name="feedback_id" value={feedbackId} />
                <button
                  type="submit"
                  className="rounded-md border border-red-200 bg-white px-3 py-2 text-xs font-medium text-red-700 hover:bg-red-50"
                >
                  Delete feedback
                </button>
              </form>
            );
          }
          ''')

          # RLS: assigned staff retain edit-own, but only global supervisor may delete.
          Path('supabase/migrations/20260825084500_restrict_feedback_deletion.sql').write_text('''drop policy if exists "Assigned staff can delete own feedback"
          on public.feedback;
          ''')

          # Admin feedback UI.
          path = Path('components/admin/admin-submissions-section.tsx')
          text = path.read_text()
          text = text.replace(
            'import FeedbackEditForm from "@/components/admin/feedback-edit-form";\n',
            'import FeedbackDeleteForm from "@/components/admin/feedback-delete-form";\nimport FeedbackEditForm from "@/components/admin/feedback-edit-form";\n',
            1,
          )
          text = text.replace(
            '''                                  <p className="mt-1 text-xs text-gray-500">
                                    {formatPortalDateTime(item.created_at)}
                                    {wasEdited ? " · Edited" : ""}
                                  </p>''',
            '''                                  <p className="mt-1 text-xs text-gray-500">
                                    Posted {formatPortalDateTime(item.created_at)}
                                  </p>
                                  {wasEdited && (
                                    <p className="mt-1 text-xs text-gray-500">
                                      Edited {formatPortalDateTime(item.updated_at)}
                                    </p>
                                  )}''',
            1,
          )
          text = text.replace(
            '''                                {canEditFeedback && (
                                  <FeedbackEditForm
                                    caseId={caseId}
                                    feedback={{
                                      id: item.id,
                                      feedback_text: item.feedback_text,
                                    }}
                                  />
                                )}''',
            '''                                {canEditFeedback && (
                                  <FeedbackEditForm
                                    caseId={caseId}
                                    feedback={{
                                      id: item.id,
                                      feedback_text: item.feedback_text,
                                    }}
                                  />
                                )}
                                {canEditSubmissionDates && (
                                  <FeedbackDeleteForm
                                    caseId={caseId}
                                    feedbackId={item.id}
                                  />
                                )}''',
            1,
          )
          path.write_text(text)

          # Student feedback timestamps.
          path = Path('app/student/page.tsx')
          text = path.read_text()
          text = text.replace(
            '''                                    <p className="mt-1 text-xs text-gray-500">
                                      {formatPortalDateTime(item.created_at)}
                                      {new Date(item.updated_at).getTime() >
                                      new Date(item.created_at).getTime() + 1000
                                        ? " · Edited"
                                        : ""}
                                    </p>''',
            '''                                    <p className="mt-1 text-xs text-gray-500">
                                      Posted {formatPortalDateTime(item.created_at)}
                                    </p>
                                    {new Date(item.updated_at).getTime() >
                                      new Date(item.created_at).getTime() + 1000 && (
                                      <p className="mt-1 text-xs text-gray-500">
                                        Edited {formatPortalDateTime(item.updated_at)}
                                      </p>
                                    )}''',
            1,
          )
          path.write_text(text)

          # Changelog additions.
          path = Path('CHANGELOG.md')
          text = path.read_text()
          text = text.replace(
            '- Added an edited-state indicator based on the existing feedback `updated_at` timestamp.\n',
            '- Added explicit posted and edited date/time metadata using the existing feedback `created_at` and `updated_at` timestamps.\n- Added global-supervisor-only feedback deletion with confirmation.\n',
            1,
          )
          text = text.replace(
            '- Feedback permissions are unchanged: the primary/global supervisor may edit all feedback, while assigned staff may edit only their own feedback.\n',
            '- Feedback editing remains case-scoped: the primary/global supervisor may edit all feedback, while assigned staff may edit only their own feedback. Only the primary/global supervisor may delete feedback.\n',
            1,
          )
          path.write_text(text)
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
          git diff --check

      - name: Commit feedback polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components supabase/migrations CHANGELOG.md
          git commit -m "Polish beta.3 feedback history and deletion"
          git push
