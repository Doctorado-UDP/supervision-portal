name: Apply beta.3 changes

on:
  push:
    branches:
      - feature/editable-rich-feedback

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editable-rich-feedback

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply code changes
        run: python .github/scripts/apply_beta3.py

      - name: Install rich feedback dependencies and update release version
        run: |
          npm install react-markdown remark-gfm remark-math rehype-katex katex --save
          npm version 0.1.0-beta.3 --no-git-tag-version

      - name: Validate
        run: |
          npm run lint
          npm run build

      - name: Commit generated beta.3 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib README.md CHANGELOG.md package.json package-lock.json
          git diff --cached --check
          git commit -m "Implement beta.3 rich feedback and pagination"
          git push
