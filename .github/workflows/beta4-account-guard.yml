name: Guard beta.4 primary account

on:
  push:
    branches:
      - feature/beta4-access-account-releases

permissions:
  contents: write

jobs:
  guard:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beta4-access-account-releases
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Protect the primary supervisor email
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          actions_path = Path('app/account/actions.ts')
          actions = actions_path.read_text()
          old_import = 'import { SITE_CONFIG } from "@/lib/config/site";\n'
          new_import = 'import { SUPERVISOR_EMAIL } from "@/lib/auth/require-admin";\nimport { SITE_CONFIG } from "@/lib/config/site";\n'
          if old_import not in actions:
              raise SystemExit('Account action import anchor not found')
          actions = actions.replace(old_import, new_import, 1)

          old_email = '  const currentEmail = user.email?.trim().toLowerCase() ?? "";\n\n  if (newEmail === currentEmail) {'
          new_email = '''  const currentEmail = user.email?.trim().toLowerCase() ?? "";\n\n  if (currentEmail === SUPERVISOR_EMAIL.toLowerCase()) {\n    redirectAccount(\n      "error",\n      "The primary supervisor email is fixed because it anchors global administrative access."\n    );\n  }\n\n  if (newEmail === currentEmail) {'''
          if old_email not in actions:
              raise SystemExit('Account email guard anchor not found')
          actions = actions.replace(old_email, new_email, 1)
          actions_path.write_text(actions)

          page_path = Path('app/account/page.tsx')
          page = page_path.read_text()
          old_context = '''  const currentEmail = user.email ?? profile.email ?? "";\n  const roleLabel = isGlobalSupervisor(profile)\n    ? "Primary supervisor"'''
          new_context = '''  const currentEmail = user.email ?? profile.email ?? "";\n  const globalSupervisor = isGlobalSupervisor(profile);\n  const roleLabel = globalSupervisor\n    ? "Primary supervisor"'''
          if old_context not in page:
              raise SystemExit('Account role anchor not found')
          page = page.replace(old_context, new_context, 1)

          old_form_start = '''            <form action={requestEmailChange} className="mt-6 max-w-xl space-y-4">'''
          new_form_start = '''            {globalSupervisor ? (\n              <p className="mt-5 max-w-xl text-sm leading-6 text-gray-600">\n                The primary supervisor email is fixed because it anchors global\n                administrative access.\n              </p>\n            ) : (\n              <form action={requestEmailChange} className="mt-6 max-w-xl space-y-4">'''
          if old_form_start not in page:
              raise SystemExit('Account email form start not found')
          page = page.replace(old_form_start, new_form_start, 1)

          old_form_end = '''                Change email\n              </button>\n            </form>\n          </section>\n\n          <section className="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">\n            <h2 className="text-lg font-semibold text-gray-950">Password</h2>'''
          new_form_end = '''                Change email\n              </button>\n              </form>\n            )}\n          </section>\n\n          <section className="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">\n            <h2 className="text-lg font-semibold text-gray-950">Password</h2>'''
          if old_form_end not in page:
              raise SystemExit('Account email form end not found')
          page = page.replace(old_form_end, new_form_end, 1)
          page_path.write_text(page)
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
          git diff --check
      - name: Commit correction and remove temporary workflow
        run: |
          rm .github/workflows/beta4-account-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Protect primary supervisor account identity"
          git push
