name: Fix beta.3 feedback UI

on:
  push:
    branches:
      - feature/editable-rich-feedback

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/editable-rich-feedback

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch feedback UI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_regex(path, pattern, replacement, label):
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              p.write_text(new_text)

          replace_regex(
              'components/admin/admin-submissions-section.tsx',
              r'<p className="mt-1 text-xs text-gray-500">\s*\{formatPortalDateTime\(item\.created_at\)\}\s*\{wasEdited \? " · Edited" : ""\}\s*</p>',
              '''<p className="mt-1 text-xs text-gray-500">
                                    Posted {formatPortalDateTime(item.created_at)}
                                  </p>
                                  {wasEdited && (
                                    <p className="mt-1 text-xs text-gray-500">
                                      Edited {formatPortalDateTime(item.updated_at)}
                                    </p>
                                  )}''',
              'admin timestamp'
          )

          replace_regex(
              'components/admin/admin-submissions-section.tsx',
              r'\{canEditFeedback && \(\s*<FeedbackEditForm\s*caseId=\{caseId\}\s*feedback=\{\{\s*id: item\.id,\s*feedback_text: item\.feedback_text,\s*\}\}\s*/>\s*\)\}',
              '''{canEditFeedback && (
                                  <FeedbackEditForm
                                    caseId={caseId}
                                    feedback={{
                                      id: item.id,
                                      feedback_text: item.feedback_text,
                                    }}
                                  />
                                )}
                                {canEditSubmissionDates && (
                                  <FeedbackDeleteForm
                                    caseId={caseId}
                                    feedbackId={item.id}
                                  />
                                )}''',
              'admin delete control'
          )

          replace_regex(
              'app/student/page.tsx',
              r'<p className="mt-1 text-xs text-gray-500">\s*\{formatPortalDateTime\(item\.created_at\)\}\s*\{new Date\(item\.updated_at\)\.getTime\(\) >\s*new Date\(item\.created_at\)\.getTime\(\) \+ 1000\s*\? " · Edited"\s*: ""\}\s*</p>',
              '''<p className="mt-1 text-xs text-gray-500">
                                      Posted {formatPortalDateTime(item.created_at)}
                                    </p>
                                    {new Date(item.updated_at).getTime() >
                                      new Date(item.created_at).getTime() + 1000 && (
                                      <p className="mt-1 text-xs text-gray-500">
                                        Edited {formatPortalDateTime(item.updated_at)}
                                      </p>
                                    )}''',
              'student timestamp'
          )

          admin = Path('components/admin/admin-submissions-section.tsx').read_text()
          student = Path('app/student/page.tsx').read_text()
          assert 'Edited {formatPortalDateTime(item.updated_at)}' in admin
          assert '<FeedbackDeleteForm' in admin
          assert 'Edited {formatPortalDateTime(item.updated_at)}' in student
          PY

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
          git diff --check

      - name: Commit corrected UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/admin/admin-submissions-section.tsx app/student/page.tsx
          git commit -m "Show feedback edit timestamps and admin delete control"
          git push
