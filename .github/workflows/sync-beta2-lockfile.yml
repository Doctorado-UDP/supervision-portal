name: Sync beta.2 lockfile metadata

on:
  push:
    branches:
      - feature/edit-planning-submission-dates

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[skip lockfile sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/edit-planning-submission-dates
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Synchronise package metadata
        run: npm version 0.1.0-beta.2 --no-git-tag-version --allow-same-version

      - name: Remove temporary workflow and commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-beta2-lockfile.yml
          git add package.json package-lock.json
          git commit -m "Sync beta.2 package lock metadata [skip lockfile sync]"
          git push origin HEAD:feature/edit-planning-submission-dates
