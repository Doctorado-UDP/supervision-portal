name: Finalise beta.4 account lifecycle

on:
  push:
    branches:
      - feature/beta4-access-account-releases

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beta4-access-account-releases
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update CHANGELOG
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '- Added a primary/global-supervisor-only Access area for viewing portal accounts and managing Student and Staff invitations.\n'
          addition = (
              '- Added automatic invitation acceptance tracking on Auth sign-in so completed onboarding no longer remains marked as pending.\n'
              '- Added guarded primary-supervisor-only account deletion in Access; unused accounts and empty individual Student setups can be removed while accounts with supervision history, group supervision, or Staff assignments are protected.\n'
          )
          if addition not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG summary marker not found')
              text = text.replace(marker, marker + addition, 1)
          auth_marker = '- The Edge Function uses Supabase\'s service role only inside the Supabase runtime; no service-role credential is added to Netlify or browser code.\n'
          auth_addition = (
              '- Added an Auth-user sign-in trigger to reconcile managed invitations as accepted, including existing invited users who have already signed in.\n'
              '- Added the JWT-protected `delete-supervision-user` Edge Function for guarded account removal without exposing the service-role credential to the application.\n'
          )
          if auth_addition not in text:
              if auth_marker not in text:
                  raise SystemExit('CHANGELOG auth marker not found')
              text = text.replace(auth_marker, auth_marker + auth_addition, 1)
          account_marker = '- Added a personal Account page for signed-in users to update their own name, request an email change, and change their password without changing portal permissions.\n'
          account_addition = '- Added UDP branding to the Account page for consistency with the main portal header.\n'
          if account_addition not in text:
              if account_marker not in text:
                  raise SystemExit('CHANGELOG account marker not found')
              text = text.replace(account_marker, account_marker + account_addition, 1)
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit final documentation and remove temporary workflow
        run: |
          rm .github/workflows/beta4-final-access-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/beta4-final-access-docs.yml
          git commit -m "Document beta.4 account lifecycle fixes"
          git push
