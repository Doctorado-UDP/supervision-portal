name: Validate beta.4 account corrections

on:
  push:
    branches:
      - feature/beta4-access-account-releases

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beta4-access-account-releases
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/beta4-account-delete-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/beta4-account-delete-validation.yml
          git commit -m "Remove temporary beta.4 validation workflow"
          git push
