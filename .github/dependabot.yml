version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    # Major upgrades (Next.js, React, ESLint, TypeScript, Supabase CLI) are
    # planned deliberately, not raised automatically.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Security fixes still open as soon as an advisory is published,
      # but together in one pull request instead of one per package.
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
